# Packaging metadata for the v3 engine.
#
# This file exists because of a round-3 verifier finding: `import nanomem` on
# this machine resolved to an EDITABLE install of nanomem 0.1.0 pointing at a
# stale v2 copy of the package, which has no crypto.py and no container.py.
# Every script, server and notebook run from a directory that did not shadow it
# got the v2 engine -- including its false "256-bit Projected Stream Cipher"
# label. nanomem_standalone had no build configuration at all, so there was
# nothing to install in its place. There is now:
#
#     python3 -m pip install -e "/path/to/nanomem_standalone"
#
# The version is read from nanomem/__init__.py so the distribution and the
# import can never disagree again (0.1.0 == v2, 0.3.0 == v3).
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanomem"
dynamic = ["version"]
description = "Embedded single-file store for facts that change: exact vector search, full revision history, no server."
readme = "README.md"
keywords = ["embedded-database", "vector-search", "memory", "single-file",
            "append-only", "temporal", "local-first", "mcp", "agents", "rag"]
requires-python = ">=3.8"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "COMMERCIAL-LICENSE.md",
                 "LICENSE.preview-v1.0.md"]
authors = [
    { name = "Om Yadorao Bansod", email = "ombansod123@gmail.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database :: Database Engines/Servers"
]
dependencies = [
    "numpy>=1.20.0"
]

[project.scripts]
nanomem = "nanomem.cli:main"

# [project.urls] is intentionally absent until a real one exists. It used to
# carry Homepage = https://nanomem.dev (does not resolve) and Repository =
# https://github.com/nanomem-ai/nanomem (404). Two dead links on a PyPI page
# read as abandoned before anyone installs anything. release_preflight.py
# refuses to publish if placeholder URLs come back.

[tool.setuptools]
packages = ["nanomem"]

[tool.setuptools.dynamic]
version = { attr = "nanomem.__version__" }

# The trained write-gate head. Without this file `CognitiveManifoldClassifier`
# silently falls back to the surface-only constants baked into classifier.py.
# Measured on the held-out 2-persona set (231 turns, 88 stored) in
# scratch/refound/write_classifier_v2_results.json: the shipped decision
# function with the head scores acc 90.48% / F1 87.21% ("heldout.full"), the
# surface-only fallback 87.01% / 82.76% ("heldout.surface") -- so losing the
# asset costs 3.5 pts of accuracy and 4.5 pts of F1, silently.
# `[tool.setuptools] packages = [...]` alone does NOT pull it into the wheel:
# built without this section, the archive has no `nanomem/assets/` entry at all.
[tool.setuptools.package-data]
nanomem = ["assets/*.npz"]
